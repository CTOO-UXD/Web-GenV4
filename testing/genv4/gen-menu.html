<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Gen menu</title>
    <style>
      body {
        margin: 24px;
        background: #e7e2de;
        color: #1c1b1b;
        font: 14px/20px sans-serif;
      }

      h1 {
        font-size: 20px;
      }

      .themes {
        display: flex;
        gap: 48px;
        align-items: flex-start;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 28px;
        width: 360px;
      }

      .demo {
        position: relative;
      }

      md-text-input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>菜单</h1>
    <div class="themes" id="themes"></div>
    <script type="module">
      import '../../gen-menu/gen-menu.js';
      import '../../gen-menu/gen-menu-group.js';
      import '../../gen-menu/gen-menu-item.js';
      import '../../icon/icon.js';
      import '../../text-input/text-input.js';

      const outline =
        'M8 18L12 14.95L16 18L14.5 13.05L18.5 10.2H13.6L12 5L10.4 10.2H5.5L9.5 13.05L8 18ZM12 22C10.6167 22 9.31667 21.7375 8.1 21.2125C6.88333 20.6875 5.825 19.975 4.925 19.075C4.025 18.175 3.3125 17.1167 2.7875 15.9C2.2625 14.6833 2 13.3833 2 12C2 10.6167 2.2625 9.31667 2.7875 8.1C3.3125 6.88333 4.025 5.825 4.925 4.925C5.825 4.025 6.88333 3.3125 8.1 2.7875C9.31667 2.2625 10.6167 2 12 2C13.3833 2 14.6833 2.2625 15.9 2.7875C17.1167 3.3125 18.175 4.025 19.075 4.925C19.975 5.825 20.6875 6.88333 21.2125 8.1C21.7375 9.31667 22 10.6167 22 12C22 13.3833 21.7375 14.6833 21.2125 15.9C20.6875 17.1167 19.975 18.175 19.075 19.075C18.175 19.975 17.1167 20.6875 15.9 21.2125C14.6833 21.7375 13.3833 22 12 22ZM12 20C14.2333 20 16.125 19.225 17.675 17.675C19.225 16.125 20 14.2333 20 12C20 9.76667 19.225 7.875 17.675 6.325C16.125 4.775 14.2333 4 12 4C9.76667 4 7.875 4.775 6.325 6.325C4.775 7.875 4 9.76667 4 12C4 14.2333 4.775 16.125 6.325 17.675C7.875 19.225 9.76667 20 12 20Z';
      const filledDisk =
        'M8 18L12 14.95L16 18L14.5 13.05L18.5 10.2H13.6L12 5L10.4 10.2H5.5L9.5 13.05L8 18ZM12 22C10.6167 22 9.31667 21.7375 8.1 21.2125C6.88333 20.6875 5.825 19.975 4.925 19.075C4.025 18.175 3.3125 17.1167 2.7875 15.9C2.2625 14.6833 2 13.3833 2 12C2 10.6167 2.2625 9.31667 2.7875 8.1C3.3125 6.88333 4.025 5.825 4.925 4.925C5.825 4.025 6.88333 3.3125 8.1 2.7875C9.31667 2.2625 10.6167 2 12 2C13.3833 2 14.6833 2.2625 15.9 2.7875C17.1167 3.3125 18.175 4.025 19.075 4.925C19.975 5.825 20.6875 6.88333 21.2125 8.1C21.7375 9.31667 22 10.6167 22 12C22 13.3833 21.7375 14.6833 21.2125 15.9C20.6875 17.1167 19.975 18.175 19.075 19.075C18.175 19.975 17.1167 20.6875 15.9 21.2125C14.6833 21.7375 13.3833 22 12 22Z';
      const inner = outline.slice(outline.lastIndexOf('M12 20'));

      const star = (filled) =>
        `<svg slot="start" ${filled ? 'selected' : ''} viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="${filled ? filledDisk + inner : outline}"></path></svg>`;
      const stars = () => star(false) + star(true);
      const arrow =
        '<svg slot="end" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M8.333 14.167V5.833L12.5 10L8.333 14.167Z"></path></svg>';
      const check = (slot) =>
        `<md-icon slot="${slot}" selected aria-hidden="true">check</md-icon>`;

      function menu(id, label, theme, body, extra = '') {
        return `
          <div class="demo">
            <md-text-input id="${id}" label="${label}" readonly></md-text-input>
            <md-gen-menu anchor="${id}" theme="${theme}" quick default-focus="none" anchor-corner="end-start" menu-corner="start-start" y-offset="4" ${extra}>
              ${body}
            </md-gen-menu>
          </div>`;
      }

      function section(theme) {
        const group = (body) => `<md-gen-menu-group>${body}</md-gen-menu-group>`;
        const row = (label, bits = '') =>
          `<md-gen-menu-item ${bits}>${label}</md-gen-menu-item>`;
        return `
          <section>
            <h2>${theme}</h2>
            ${menu(
              `${theme}-one`,
              '单卡',
              theme,
              `
                ${row('没有图标')}
                <md-gen-menu-item>${stars()}空心星</md-gen-menu-item>
                <md-gen-menu-item>箭头 ${arrow}</md-gen-menu-item>
                <md-gen-menu-item selected>${stars()}选中 ${arrow}</md-gen-menu-item>
                <md-gen-menu-item disabled>禁用</md-gen-menu-item>
                <md-gen-menu-item selected disabled>${stars()}选中并且禁用 ${arrow}</md-gen-menu-item>
                <md-gen-menu-item>这是一段长得不应该把菜单撑宽的文字</md-gen-menu-item>
              `,
            )}
            ${menu(
              `${theme}-two`,
              '两组',
              theme,
              group(`${row('第一组')}${row(`${stars()}第一组另一条`, 'selected')}`) +
                group(`${row('第二组')}${row('第二组另一条')}`),
            )}
            ${menu(
              `${theme}-three`,
              '三组',
              theme,
              group(row('第一组')) + group(row('第二组')) + group(row('第三组')),
            )}
            ${menu(
              `${theme}-scroll`,
              '滚动',
              theme,
              Array.from({length: 30}, (_, index) => row(`滚动 ${index + 1}`)).join(''),
            )}
            ${menu(
              `${theme}-wide`,
              '宽度 280',
              theme,
              row('宽度改成 280'),
              'style="--md-gen-menu-width: 280px"',
            )}
            ${menu(
              `${theme}-add`,
              '选中加图标',
              theme,
              ['一条', '两条', '三条', '四条', '五条']
                .map(
                  (label, index) =>
                    `<md-gen-menu-item ${index === 2 ? 'selected' : ''}>${check('start')}${label}</md-gen-menu-item>`,
                )
                .join(''),
            )}
            ${menu(
              `${theme}-swap`,
              '选中换星',
              theme,
              ['一条', '两条', '三条', '四条']
                .map(
                  (label, index) =>
                    `<md-gen-menu-item ${index === 1 ? 'selected' : ''}>${stars()}${label}</md-gen-menu-item>`,
                )
                .join(''),
            )}
            ${menu(
              `${theme}-end`,
              '尾部换勾',
              theme,
              ['一条', '两条', '三条', '四条']
                .map(
                  (label, index) =>
                    `<md-gen-menu-item ${index === 1 ? 'selected' : ''}>${star(false)}${arrow}${check('end')}${label}</md-gen-menu-item>`,
                )
                .join(''),
            )}
          </section>`;
      }

      const root = document.querySelector('#themes');
      root.innerHTML = section('standard') + section('vibrant');

      function labelOf(item) {
        return Array.from(item.childNodes)
          .filter((node) => node.nodeType === Node.TEXT_NODE)
          .map((node) => node.textContent.trim())
          .filter(Boolean)
          .join('');
      }

      for (const menu of root.querySelectorAll('md-gen-menu')) {
        const field = document.getElementById(menu.anchor);
        const picked = menu.querySelector('md-gen-menu-item[selected]');
        if (picked) field.value = labelOf(picked);
        field.addEventListener('click', () => {
          if (menu.open) {
            menu.close();
            return;
          }
          for (const other of root.querySelectorAll('md-gen-menu')) {
            if (other !== menu) other.close();
          }
          menu.show();
        });
        menu.addEventListener('click', (event) => {
          const item = event.target.closest('md-gen-menu-item');
          if (!item || !menu.contains(item) || item.disabled) return;
          field.value = labelOf(item);
          for (const other of menu.querySelectorAll('md-gen-menu-item')) {
            other.selected = other === item;
          }
        });
      }
    </script>
  </body>
</html>
