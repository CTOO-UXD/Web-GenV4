<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenV4 Card 验收</title>
    <script type="module">
      import '../../labs/card/elevated-card.js';
      import '../../labs/card/filled-card.js';
      import '../../labs/card/outlined-card.js';
    </script>
    <style>
      body {
        margin: 0;
        background: #ece6f0;
        color: #1d1b20;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 32px auto;
      }

      h1 {
        margin-block-end: 8px;
      }

      section {
        margin-block-end: 28px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      md-filled-card,
      md-elevated-card,
      md-outlined-card {
        width: 240px;
      }

      md-filled-card:not(:defined),
      md-elevated-card:not(:defined),
      md-outlined-card:not(:defined) {
        display: none;
      }

      .media {
        height: 96px;
        background: #6750a4;
      }

      button {
        margin: 0 16px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Card 验收</h1>
      <p>图片贴边，文字左右留 16px。带链接的卡片可以进入详情，保存按钮不触发整张卡片。</p>

      <section>
        <h2>三种容器</h2>
        <div class="row">
          <md-filled-card>
            <div class="media"></div>
            <div slot="content">Filled</div>
          </md-filled-card>
          <md-elevated-card>
            <div class="media"></div>
            <div slot="content">Elevated</div>
          </md-elevated-card>
          <md-outlined-card>
            <div class="media"></div>
            <div slot="content">Outlined</div>
          </md-outlined-card>
        </div>
      </section>

      <section>
        <h2>主点击和内部按钮</h2>
        <div class="row">
          <md-filled-card id="linked" href="#opened">
            <div class="media"></div>
            <div slot="content">点击卡片</div>
            <button slot="action" id="save" type="button">保存</button>
          </md-filled-card>
          <md-outlined-card href="#disabled" disabled>
            <div class="media"></div>
            <div slot="content">已禁用</div>
          </md-outlined-card>
        </div>
        <p id="status">还没有点击。</p>
      </section>
    </main>
    <script>
      document.querySelector('#save').addEventListener('click', (event) => {
        event.stopPropagation();
        document.querySelector('#status').textContent = '点击了保存，没有进入详情。';
      });
      document.querySelector('#linked').addEventListener('click', () => {
        document.querySelector('#status').textContent = '点击了卡片主区域。';
      });
    </script>
  </body>
</html>
