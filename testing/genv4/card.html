<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenV4 Card 验收</title>
    <script type="module">
      import '../../button/text-button.js';
      import '../../labs/card/elevated-card.js';
      import '../../labs/card/filled-card.js';
      import '../../labs/card/outlined-card.js';
    </script>
    <style>
      body {
        margin: 0;
        background: #ece6f0;
        color: #1d1b20;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 32px auto;
      }

      h1 {
        margin-block-end: 8px;
      }

      section {
        margin-block-end: 28px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      md-filled-card,
      md-elevated-card,
      md-outlined-card {
        width: 240px;
      }

      md-filled-card:not(:defined),
      md-elevated-card:not(:defined),
      md-outlined-card:not(:defined) {
        display: none;
      }

      .media {
        height: 120px;
        background: #6750a4;
      }

      .headline,
      .subhead,
      .supporting {
        margin: 0;
      }

      .headline {
        font-size: 18px;
      }

      .subhead {
        margin-top: 4px;
        color: #49454f;
        font-size: 14px;
      }

      .supporting {
        margin-top: 12px;
        font-size: 14px;
        line-height: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
        padding: 8px 16px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Card 验收</h1>
      <p>图片贴边，文字左右留 16px。带链接的卡片可以进入详情，保存按钮不触发整张卡片。</p>

      <section>
        <h2>三种容器</h2>
        <div class="row">
          <md-filled-card>
            <div class="media"></div>
            <div slot="content">Filled</div>
          </md-filled-card>
          <md-elevated-card>
            <div class="media"></div>
            <div slot="content">Elevated</div>
          </md-elevated-card>
          <md-outlined-card>
            <div class="media"></div>
            <div slot="content">Outlined</div>
          </md-outlined-card>
        </div>
      </section>

      <section>
        <h2>一张卡片里可以放的内容</h2>
        <md-elevated-card id="album" href="#album-detail" style="width: 280px">
          <div class="media"></div>
          <div slot="content">
            <h3 class="headline">周末相册</h3>
            <p class="subhead">上海 · 12 张照片</p>
            <p class="supporting">点击图片或文字进入详情。保存和分享是卡片内部的独立操作。</p>
          </div>
          <div class="actions" slot="action">
            <md-text-button id="save" type="button">保存</md-text-button>
            <md-text-button id="share" type="button">分享</md-text-button>
          </div>
        </md-elevated-card>
        <p id="status">还没有点击。</p>
      </section>
    </main>
    <script>
      document.querySelector('#save').addEventListener('click', (event) => {
        event.stopPropagation();
        document.querySelector('#status').textContent = '点击了保存，没有进入详情。';
      });
      document.querySelector('#share').addEventListener('click', (event) => {
        event.stopPropagation();
        document.querySelector('#status').textContent = '点击了分享，没有进入详情。';
      });
      document.querySelector('#album').addEventListener('click', () => {
        document.querySelector('#status').textContent = '点击了卡片主区域。';
      });
    </script>
  </body>
</html>
