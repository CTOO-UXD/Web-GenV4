<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Modal</title>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, sans-serif;
      }

      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin: 0 0 16px;
      }

      label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <label>variant <select id="variant"></select></label>
      <label>size <select id="size"></select></label>
      <label>layout <select id="layout"></select></label>
      <label>tertiary <select id="tertiary"></select></label>
      <label><input id="cancel" type="checkbox" /> cancel</label>
      <label><input id="secondary" type="checkbox" /> secondary</label>
      <label><input id="tertiary-action" type="checkbox" checked /> tertiary</label>
      <label><input id="subtitle" type="checkbox" /> subtitle</label>
      <label><input id="leading" type="checkbox" checked /> leading</label>
      <label><input id="close" type="checkbox" /> close</label>
      <label><input id="margin" type="checkbox" checked /> content margin</label>
      <button id="open" type="button">打开</button>
    </fieldset>
    <p id="result"></p>
    <md-modal title="标题">
      这里是弹窗内容。
      <span slot="cancel">取消</span>
      <span slot="secondary">次要</span>
      <span slot="primary">主要</span>
      <span slot="tertiary">第三操作</span>
    </md-modal>
    <script type="module">
      import '../../modal/modal.js';

      const modal = document.querySelector('md-modal');
      const result = document.querySelector('#result');
      const selects = {
        variant: ['neutral', 'informational', 'success', 'error', 'destructive', 'system'],
        size: ['narrow', 'wide'],
        layout: ['horizontal', 'vertical', 'horizontal-fill'],
        tertiary: ['button', 'checkbox'],
      };
      for (const [id, values] of Object.entries(selects)) {
        const select = document.querySelector('#' + id);
        for (const value of values) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.append(option);
        }
        select.addEventListener('change', () => {
          modal[id] = select.value;
        });
      }
      const flags = [
        ['cancel', 'showCancel'],
        ['secondary', 'showSecondaryAction'],
        ['tertiary-action', 'showTertiaryAction'],
        ['subtitle', 'showSubtitle'],
        ['leading', 'leadingItem'],
        ['close', 'closeButton'],
        ['margin', 'contentMargin'],
      ];
      for (const [id, key] of flags) {
        const input = document.querySelector('#' + id);
        modal[key] = input.checked;
        input.addEventListener('change', () => {
          modal[key] = input.checked;
        });
      }
      modal.subtitle = '副标题最多两行。副标题最多两行。副标题最多两行。';
      document.querySelector('#open').addEventListener('click', () => {
        modal.open = true;
      });
      modal.addEventListener('close', () => {
        result.textContent = 'close，returnValue=' + modal.returnValue;
      });
      modal.addEventListener('cancel', () => {
        result.textContent = 'cancel，returnValue=' + modal.returnValue;
      });
    </script>
  </body>
</html>
